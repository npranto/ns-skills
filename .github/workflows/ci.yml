name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate.py --release
      - run: python3 -m unittest discover -s tests
      - run: python3 scripts/route_corpus.py check
      - run: python3 skills/ns-route/scripts/ns selftest
